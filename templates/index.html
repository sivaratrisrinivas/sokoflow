<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SokoFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --surface: #111;
            --border: #222;
            --dim: #444;
            --text: #fff;
            --accent: #ff6b00;
            --success: #0f0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 16px;
        }

        /* Grid */
        #grid {
            display: grid;
            grid-template-columns: repeat(8, 48px);
            grid-template-rows: repeat(8, 48px);
            gap: 2px;
            background: var(--border);
            padding: 2px;
        }

        .cell {
            width: 48px;
            height: 48px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wall { background: #1a1a1a; }
        
        .target::after {
            content: '';
            width: 12px;
            height: 12px;
            background: var(--accent);
            opacity: 0.5;
            border-radius: 50%;
        }

        .box {
            width: 34px;
            height: 34px;
            background: var(--dim);
            border: 2px solid var(--text);
        }

        .box.on-target {
            background: var(--success);
            border-color: var(--success);
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }

        .player {
            width: 30px;
            height: 30px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255,107,0,0.4);
        }

        /* Status */
        .status {
            font-size: 11px;
            letter-spacing: 0.15em;
            color: var(--dim);
            text-transform: uppercase;
            height: 16px;
        }

        .status.solving { color: var(--accent); }
        .status.solved { color: var(--success); }

        /* Single Button */
        button {
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 14px 32px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        button:hover { opacity: 0.85; }
        button:active { transform: scale(0.98); }

        /* Stats - minimal */
        .stats {
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--dim);
            display: flex;
            gap: 24px;
        }

        .stats span { color: var(--text); }

        .honest {
            max-width: 420px;
            text-align: center;
            font-size: 10px;
            line-height: 1.5;
            letter-spacing: 0.04em;
            color: var(--dim);
        }

        @media (max-width: 520px) {
            #grid {
                grid-template-columns: repeat(8, 36px);
                grid-template-rows: repeat(8, 36px);
            }
            .cell { width: 36px; height: 36px; }
            .box { width: 24px; height: 24px; }
            .player { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>

    <div id="grid"></div>
    
    <div class="status" id="status">Ready</div>
    
    <button onclick="toggle()" id="btn">Start</button>
    
    <div class="stats">
        Solved <span id="solved">0</span> · Moves <span id="moves">0</span>
    </div>

    <p class="honest">
        CPU demo. GS-T5 (2026-08-24): diffusion 20.8% (50/240) vs BFS 95.4% (229/240).
        Not scramble-hard — 43/50 wins are 1-box-off short trajectories. First request may be a cold start.
    </p>

    <script>
        let running = false;
        let solved = 0;
        let moves = 0;
        let localGrid = null;
        let localTargets = null;
        let localPath = [];
        let localIndex = 0;
        const DELTAS = {UP: [-1, 0], DOWN: [1, 0], LEFT: [0, -1], RIGHT: [0, 1]};

        function applyMove(grid, targets, action) {
            const [dr, dc] = DELTAS[action];
            let pr = -1, pc = -1;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (grid[r][c] === 2) { pr = r; pc = c; }
                }
            }
            if (pr < 0) return null;
            const nr = pr + dr, nc = pc + dc;
            if (nr < 0 || nr > 7 || nc < 0 || nc > 7) return null;
            const next = grid.map(row => row.slice());
            const cell = next[nr][nc];
            if (cell === 1) return null;
            if (cell === 0 || cell === 4) {
                next[pr][pc] = targets[pr][pc] ? 4 : 0;
                next[nr][nc] = 2;
                return next;
            }
            if (cell === 3 || cell === 5) {
                const nnr = nr + dr, nnc = nc + dc;
                if (nnr < 0 || nnr > 7 || nnc < 0 || nnc > 7) return null;
                if (next[nnr][nnc] !== 0 && next[nnr][nnc] !== 4) return null;
                next[pr][pc] = targets[pr][pc] ? 4 : 0;
                next[nr][nc] = 2;
                next[nnr][nnc] = targets[nnr][nnc] ? 5 : 3;
                return next;
            }
            return null;
        }

        function gridSolved(grid) {
            return grid.every(row => row.every(v => v !== 3));
        }

        async function newGame() {
            setStatus('Computing (cold start possible)...', 'solving');
            const res = await fetch('/api/new_game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ difficulty: 25 })
            });
            if (res.status === 429) {
                setStatus('Rate limited', '');
                await sleep(1200);
                return false;
            }
            const data = await res.json();
            localGrid = data.grid;
            localTargets = data.targets;
            localPath = data.path || [];
            localIndex = 0;
            render(data.grid);
            return Boolean(data.solvable && localPath.length);
        }

        async function step() {
            if (localPath.length) {
                if (localIndex >= localPath.length) {
                    return gridSolved(localGrid) ? finishSolved(localPath.length) : 'failed';
                }
                const action = localPath[localIndex];
                const next = applyMove(localGrid, localTargets, action);
                localIndex += 1;
                if (next) localGrid = next;
                render(localGrid);
                if (gridSolved(localGrid)) return finishSolved(localIndex);
                setStatus(`Solving ${localIndex}/${localPath.length}`, 'solving');
                return 'continue';
            }

            const res = await fetch('/api/solve_step', { method: 'POST' });
            const data = await res.json();
            render(data.grid);

            if (data.solved) return finishSolved(data.steps);
            if (data.gave_up) return 'failed';

            setStatus(`Solving ${data.steps}/${data.total}`, 'solving');
            return 'continue';
        }

        function finishSolved(stepCount) {
            solved++;
            moves += stepCount;
            document.getElementById('solved').textContent = solved;
            document.getElementById('moves').textContent = moves;
            return 'solved';
        }

        async function run() {
            while (running) {
                setStatus('Computing...', 'solving');
                const ok = await newGame();
                if (!ok) {
                    await sleep(400);
                    continue;
                }
                
                setStatus('Solving...', 'solving');
                
                while (running) {
                    const result = await step();
                    if (result === 'solved') {
                        setStatus('Solved', 'solved');
                        await sleep(300);
                        break;
                    }
                    if (result === 'failed') {
                        break;
                    }
                    await sleep(15);
                }
            }
        }

        function toggle() {
            running = !running;
            document.getElementById('btn').textContent = running ? 'Stop' : 'Start';
            if (running) run();
            else setStatus('Paused', '');
        }

        function setStatus(text, state) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = 'status ' + (state || '');
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function render(grid) {
            const container = document.getElementById('grid');
            container.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const v = grid[r][c];
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (v === 1) cell.classList.add('wall');
                    if (v === 4) cell.classList.add('target');
                    if (v === 3) cell.innerHTML = '<div class="box"></div>';
                    if (v === 5) { cell.classList.add('target'); cell.innerHTML = '<div class="box on-target"></div>'; }
                    if (v === 2) cell.innerHTML = '<div class="player"></div>';
                    
                    container.appendChild(cell);
                }
            }
        }

        newGame();
    </script>
</body>
</html>
