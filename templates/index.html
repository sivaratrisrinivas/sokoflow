<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SokoFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F3EEE4;
            --paper: #FAF7F1;
            --ink: #2B2926;
            --muted: #8A847A;
            --sky: #D7E6F0;
            --wall: #C4A574;
            --floor: #F7F1E6;
            --box: #E39B2D;
            --goal: #5BA8D4;
            --player: #E25A45;
            --box-on-goal: #3DAA6D;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 48px 20px 56px;
        }

        .wordmark {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(8, 44px);
            grid-template-rows: repeat(8, 44px);
            gap: 5px;
            padding: 10px;
            background: var(--floor);
            border-radius: 18px;
        }

        .cell {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--floor);
            box-shadow: inset 0 0 0 1px rgba(196, 165, 116, 0.25);
        }

        .wall {
            background: var(--wall);
            box-shadow: inset 0 -3px 0 rgba(90, 64, 32, 0.18);
        }

        .target::after {
            content: "";
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--goal);
        }

        .box {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: var(--box);
            box-shadow: 0 3px 0 rgba(160, 90, 10, 0.28);
        }

        .box.on-target {
            background: var(--box-on-goal);
            box-shadow: 0 3px 0 rgba(20, 90, 50, 0.28);
        }

        .player {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--player);
            box-shadow: 0 3px 0 rgba(140, 40, 28, 0.25);
        }

        .status {
            min-height: 20px;
            font-size: 14px;
            color: var(--muted);
            letter-spacing: 0.01em;
        }

        .status.solving { color: var(--ink); }
        .status.solved { color: var(--box-on-goal); }

        button#btn {
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.02em;
            padding: 14px 44px;
            background: var(--ink);
            color: var(--paper);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(43, 41, 38, 0.12);
        }

        button#btn:hover { opacity: 0.92; }
        button#btn:active { transform: scale(0.98); }

        .quiet {
            font-size: 13px;
            color: var(--muted);
            display: flex;
            gap: 18px;
        }

        .quiet button {
            font-family: inherit;
            font-size: 13px;
            color: var(--muted);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: none;
            padding: 0;
        }

        .quiet button:hover { color: var(--ink); }

        .honest {
            max-width: 360px;
            text-align: center;
            font-size: 12px;
            line-height: 1.55;
            color: var(--muted);
        }

        @media (max-width: 520px) {
            #grid {
                grid-template-columns: repeat(8, 34px);
                grid-template-rows: repeat(8, 34px);
                gap: 4px;
            }
            .cell { width: 34px; height: 34px; }
            .box { width: 22px; height: 22px; }
            .player { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>

    <p class="wordmark">SokoFlow</p>

    <div id="grid" aria-label="Sokoban board"></div>

    <div class="status" id="status">A puzzle is ready.</div>

    <!-- Puzzle loads immediately. Play is the only required click (≤2 from load). -->
    <button onclick="playOnce()" id="btn">Play</button>

    <div class="quiet">
        <button type="button" onclick="freshPuzzle()">New puzzle</button>
    </div>

    <p class="honest">
        One click runs diffusion on the board above.
        Scramble-hard (2026-09-21): diffusion 6.2% (15/240) vs BFS 94.2% (226/240).
        GS-T5 20.8% is historical — not scramble-hard.
    </p>

    <script>
        let playing = false;
        let localGrid = null;
        let localTargets = null;
        let localPath = [];
        let localIndex = 0;
        const DELTAS = {UP: [-1, 0], DOWN: [1, 0], LEFT: [0, -1], RIGHT: [0, 1]};

        function applyMove(grid, targets, action) {
            const [dr, dc] = DELTAS[action];
            let pr = -1, pc = -1;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (grid[r][c] === 2) { pr = r; pc = c; }
                }
            }
            if (pr < 0) return null;
            const nr = pr + dr, nc = pc + dc;
            if (nr < 0 || nr > 7 || nc < 0 || nc > 7) return null;
            const next = grid.map(row => row.slice());
            const cell = next[nr][nc];
            if (cell === 1) return null;
            if (cell === 0 || cell === 4) {
                next[pr][pc] = targets[pr][pc] ? 4 : 0;
                next[nr][nc] = 2;
                return next;
            }
            if (cell === 3 || cell === 5) {
                const nnr = nr + dr, nnc = nc + dc;
                if (nnr < 0 || nnr > 7 || nnc < 0 || nnc > 7) return null;
                if (next[nnr][nnc] !== 0 && next[nnr][nnc] !== 4) return null;
                next[pr][pc] = targets[pr][pc] ? 4 : 0;
                next[nr][nc] = 2;
                next[nnr][nnc] = targets[nnr][nnc] ? 5 : 3;
                return next;
            }
            return null;
        }

        function gridSolved(grid) {
            return grid.every(row => row.every(v => v !== 3));
        }

        async function newGame() {
            setStatus('Preparing…', 'solving');
            const res = await fetch('/api/new_game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ difficulty: 25 })
            });
            if (res.status === 429) {
                setStatus('Rate limited', '');
                return false;
            }
            const data = await res.json();
            localGrid = data.grid;
            localTargets = data.targets;
            localPath = data.path || [];
            localIndex = 0;
            render(data.grid);
            setStatus(localPath.length ? 'A puzzle is ready.' : 'No path this time — try New puzzle.', '');
            return Boolean(data.solvable && localPath.length);
        }

        async function step() {
            if (localIndex >= localPath.length) {
                return gridSolved(localGrid) ? 'solved' : 'failed';
            }
            const action = localPath[localIndex];
            const next = applyMove(localGrid, localTargets, action);
            localIndex += 1;
            if (next) localGrid = next;
            render(localGrid);
            if (gridSolved(localGrid)) return 'solved';
            setStatus(`${localIndex} / ${localPath.length}`, 'solving');
            return 'continue';
        }

        async function playOnce() {
            if (playing) return;
            playing = true;
            document.getElementById('btn').textContent = 'Playing';
            if (!localPath.length) {
                const ok = await newGame();
                if (!ok) {
                    playing = false;
                    document.getElementById('btn').textContent = 'Play';
                    return;
                }
            }
            setStatus('Running diffusion path…', 'solving');
            while (playing) {
                const result = await step();
                if (result === 'solved') {
                    setStatus('Solved', 'solved');
                    break;
                }
                if (result === 'failed') {
                    setStatus('Stopped', '');
                    break;
                }
                await sleep(90);
            }
            playing = false;
            document.getElementById('btn').textContent = 'Play';
        }

        async function freshPuzzle() {
            playing = false;
            await newGame();
            document.getElementById('btn').textContent = 'Play';
        }

        function setStatus(text, state) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = 'status ' + (state || '');
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function render(grid) {
            const container = document.getElementById('grid');
            container.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const v = grid[r][c];
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (v === 1) cell.classList.add('wall');
                    if (v === 4) cell.classList.add('target');
                    if (v === 3) cell.innerHTML = '<div class="box"></div>';
                    if (v === 5) { cell.classList.add('target'); cell.innerHTML = '<div class="box on-target"></div>'; }
                    if (v === 2) {
                        if (localTargets && localTargets[r][c]) cell.classList.add('target');
                        cell.innerHTML = '<div class="player"></div>';
                    }
                    container.appendChild(cell);
                }
            }
        }

        newGame();
    </script>
</body>
</html>
