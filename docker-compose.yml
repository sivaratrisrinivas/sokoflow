services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      CORS_ORIGINS: "*"
      RATE_LIMIT_PER_MINUTE: "30"
      SOKOFLOW_MODEL_PATH: /app/sokoban_diffusion.pth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
