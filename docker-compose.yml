services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      CORS_ORIGINS: "*"
      RATE_LIMIT_PER_MINUTE: "30"
      SOKOFLOW_MODEL_PATH: /app/sokoban_diffusion.pth
      NEW_GAME_RATE_LIMIT_PER_MINUTE: "120"
      TRUST_PROXY: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request as u; d=json.load(u.urlopen('http://127.0.0.1:5000/health')); assert d.get('model_loaded') is True"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
